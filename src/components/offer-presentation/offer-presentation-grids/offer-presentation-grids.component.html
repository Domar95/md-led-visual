<div class="bento" [class.handset]="isHandset">
  @for (category of categories; track category.route; let i = $index) {
  <a
    class="tile"
    [routerLink]="[category.route]"
    mdlvReveal
    [style.--reveal-delay]="i * 80 + 'ms'"
  >
    <div
      class="tile-image"
      [style.backgroundImage]="images[i] ? 'url(' + images[i] + ')' : null"
    ></div>
    <div class="tile-content">
      <h3 class="tile-title">{{ category.title }}</h3>
      <p class="tile-description">{{ category.description }}</p>
    </div>
    <span class="tile-arrow"><mat-icon>arrow_outward</mat-icon></span>
  </a>
  }
</div>
