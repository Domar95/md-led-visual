<mat-toolbar
  [ngClass]="variant"
  [class.handset]="isHandset"
  [class.scrolled]="isScrolled"
>
  @if (isDefault) {
  <mdlv-home-button></mdlv-home-button>
  <span class="spacer"></span>
  <ng-container *ngTemplateOutlet="buttonGroupTemplate"></ng-container>
  } @else {
  <div class="transparent-navbar-container" #centerPill>
    <span class="nav-indicator" #indicator aria-hidden="true"></span>
    <mdlv-home-button></mdlv-home-button>
    <ng-container *ngTemplateOutlet="buttonGroupTemplate"></ng-container>
  </div>
  }
</mat-toolbar>

<ng-template #buttonGroupTemplate>
  <nav class="button-group">
    @for (link of links; track link.route) {
    <a
      mat-button
      [routerLink]="link.route"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      {{ link.label }}
    </a>
    }
  </nav>
</ng-template>
