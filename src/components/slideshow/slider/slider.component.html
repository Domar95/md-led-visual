<div class="slider" [class.handset]="isHandset">
  <div class="swiper" #swiperElement>
    <div class="swiper-wrapper">
      @for (image of images; track image.uri; let i = $index) {
      <div class="swiper-slide slide">
        <div
          class="slide-image"
          [style.backgroundImage]="'url(' + image.uri + ')'"
        ></div>
        <div class="caption">
          <mdlv-slider-overlay
            [isHandset]="isHandset"
            [title]="image.title"
            [text]="image.text"
            [animationState]="activeSlideIndex === i ? '*' : 'void'"
          ></mdlv-slider-overlay>
        </div>
      </div>
      }
    </div>
  </div>
  <div class="controls">
    <div class="slideshow-pagination" #paginationElement></div>
    <div class="arrows">
      <button mat-icon-button #prevElement aria-label="Poprzedni slajd">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <button mat-icon-button #nextElement aria-label="Następny slajd">
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </div>
  </div>
</div>
