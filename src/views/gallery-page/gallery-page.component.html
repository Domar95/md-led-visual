<section class="gallery-page">
  <header class="header">
    <span class="eyebrow">Realizacje</span>
    <h1 class="title">Galeria</h1>
    <p class="text">
      Wybrane realizacje z koncertów, eventów firmowych, uroczystości
      prywatnych i prezentacji.
    </p>
  </header>

  <nav class="filters" aria-label="Kategorie galerii">
    @for (link of links; track link.route) {
    <a
      class="filter"
      [routerLink]="link.route"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      {{ link.label }}
      @if (counts()[link.route]; as count) {
      <span class="count">{{ count }}</span>
      }
    </a>
    }
  </nav>

  <router-outlet></router-outlet>
</section>
