<footer class="footer">
  @if (showCta) {
  <section class="cta" aria-labelledby="footer-cta-title">
    <div class="cta-text">
      <span class="label">Masz wydarzenie?</span>
      <h2 class="cta-title" id="footer-cta-title">
        Porozmawiajmy o&nbsp;Twoim wydarzeniu
      </h2>
    </div>
    <div class="cta-actions">
      <a mat-flat-button class="cta-primary" [routerLink]="['/kontakt']">
        Napisz do nas
        <mat-icon iconPositionEnd>arrow_forward</mat-icon>
      </a>
      <a class="cta-phone" href="tel:+48795641741">
        <mat-icon aria-hidden="true">call</mat-icon>
        +48 795 641 741
      </a>
    </div>
  </section>
  }

  <div class="columns">
    <div class="columns-grid">
      <mdlv-footer-about class="column-about"></mdlv-footer-about>
      <mdlv-footer-contact></mdlv-footer-contact>
      <mdlv-footer-navigation></mdlv-footer-navigation>
    </div>
  </div>

  <div class="bottom">
    <mdlv-footer-bottom></mdlv-footer-bottom>
  </div>
</footer>
